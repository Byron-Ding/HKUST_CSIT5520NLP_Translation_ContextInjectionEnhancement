# 用于 AI 精细语义的测试
# 翻译任务
# 羁绊 VS 牵绊
# 安心 VS 放心 VS 省心 VS 宁心
# 爱护 VS 关爱 VS 爱惜 VS 爱怜 VS 珍惜 VS 珍爱 VS 爱慕 VS 怜爱
# 承载 VS 承担 VS 负载
# 死寂 VS 寂静 VS 寂寥 VS 安静 VS 宁静


# crucial VS critical VS important VS significant vs vital
# happy vs glad vs joyful vs delighted vs pleased vs content vs satisfied vs cheerful vs ecstatic
# like vs love vs adore
# thankful vs grateful vs appreciative
# large vs huge vs enormous vs massive vs gigantic vs colossal vs immense
# impressive vs remarkable
# intelligent vs smart vs clever vs brilliant vs genius
# fast vs quick vs rapid vs speedy vs swift
# beautiful vs gorgeous



# 最简单的例子
# 1. important 组
# The meeting is critical for the success of the project.
# The meeting is crucial for the success of the project.
# The meeting is important for the success of the project.
# The meeting is significant because it will determine the results of the project.
# The meeting is vital for the success of the project.



# 如何测试
- sentence: "The meeting is {keyword} for the success of the project."
  keywords:
    - important
    - significant
    - crucial
    - critical
    - vital
    - essential

- sentence: "I am {keyword} to hear the good news."
  keywords:
    - happy
    - glad
    - joyful
    - delighted
    - pleased
    - content
    - satisfied
    - cheerful
    - ecstatic


- sentence: "我对这件事很{keyword}"
  keywords:
    # 闷闷地烦
    - 心烦
    # 主观厌恶
    - 厌烦
    # 客观烦，并且躁动不安
    - 烦躁
    # 并不主观厌恶，但客观上很麻烦
    - 烦恼
    # 只是很麻烦，并且持续性较长
    - 烦心
    # 强调厌恶
    - 讨厌

